spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/fastpass
    driver-class-name: org.postgresql.Driver
    username: fastpass
    password: fastpass

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379

fastpass:
  worker:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus