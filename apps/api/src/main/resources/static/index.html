<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastPass</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">Kubernetes Event Application System</p>
        <h1>FastPass</h1>
        <p class="hero-text">
          선착순 이벤트 신청을 Redis Queue와 Worker로 처리하고,
          Kubernetes에서 확장성과 운영 상태를 검증하는 DevOps 프로젝트입니다.
        </p>
        <div class="hero-actions">
          <button id="refreshEventsBtn">이벤트 새로고침</button>
          <button id="refreshStatusBtn" class="secondary">운영 상태 확인</button>
        </div>
      </div>

      <div class="status-card">
        <p class="card-label">System Status</p>
        <div class="status-row">
          <span>API Health</span>
          <strong id="healthStatus">-</strong>
        </div>
        <div class="status-row">
          <span>Queue Size</span>
          <strong id="queueSize">-</strong>
        </div>
        <div class="status-row">
          <span>Mode</span>
          <strong>Queue Based</strong>
        </div>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Create</p>
            <h2>이벤트 생성</h2>
          </div>
        </div>

        <form id="eventForm" class="form">
          <label>
            이벤트 제목
            <input id="eventTitle" type="text" value="FastPass Open Event" required />
          </label>

          <label>
            설명
            <input id="eventDescription" type="text" value="선착순 이벤트 신청 테스트" required />
          </label>

          <label>
            정원
            <input id="eventCapacity" type="number" value="3" min="1" required />
          </label>

          <label>
            시작 시간
            <input id="eventStartAt" type="datetime-local" required />
          </label>

          <button type="submit">이벤트 생성</button>
        </form>

        <div id="eventCreateResult" class="result"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Apply</p>
            <h2>이벤트 신청</h2>
          </div>
        </div>

        <form id="applyForm" class="form">
          <label>
            이벤트 ID
            <input id="applyEventId" type="number" placeholder="예: 1" required />
          </label>

          <label>
            신청자 이름
            <input id="applicantName" type="text" value="user-1" required />
          </label>

          <button type="submit">신청하기</button>
        </form>

        <div id="applyResult" class="result"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Lookup</p>
            <h2>신청 상태 조회</h2>
          </div>
        </div>

        <form id="applicationLookupForm" class="form">
          <label>
            신청 ID
            <input id="applicationId" type="number" placeholder="예: 1" required />
          </label>

          <button type="submit">상태 조회</button>
        </form>

        <div id="applicationResult" class="result"></div>
      </section>

      <section class="panel wide">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Events</p>
            <h2>이벤트 목록</h2>
          </div>
          <button id="eventListRefreshBtn" class="secondary small">새로고침</button>
        </div>

        <div id="eventList" class="event-list"></div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
