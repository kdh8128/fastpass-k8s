apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastpass-api
  namespace: fastpass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastpass-api
  template:
    metadata:
      labels:
        app: fastpass-api
    spec:
      containers:
        - name: fastpass-api
          image: fastpass-k8s-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fastpass-api-config
          env:
            - name: FASTPASS_WORKER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "10m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6