apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastpass-worker
  namespace: fastpass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastpass-worker
  template:
    metadata:
      labels:
        app: fastpass-worker
    spec:
      containers:
        - name: fastpass-worker
          image: fastpass-k8s-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fastpass-api-config
          env:
            - name: FASTPASS_WORKER_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "10m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10