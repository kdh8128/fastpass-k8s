namespace: fastpass

image:
  repository: ghcr.io/kdh8128/fastpass-k8s-api
  tag: fc71441a65ef352da3f6a962f44665645b87abd6
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 8080
  workerEnabled: false

worker:
  replicas: 1
  port: 8080
  workerEnabled: true

postgres:
  image: postgres:16
  database: fastpass
  username: fastpass
  password: fastpass
  port: 5432
  storage: 1Gi

redis:
  image: redis:7.2-alpine
  port: 6379

resources:
  api:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  worker:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

hpa:
  enabled: true

  api:
    minReplicas: 1
    maxReplicas: 6
    cpuAverageUtilization: 60

  worker:
    minReplicas: 1
    maxReplicas: 6
    cpuAverageUtilization: 60

monitoring:
  enabled: true
  namespace: monitoring
  releaseLabel: prometheus-stack

alerting:
  enabled: true
  queueBacklogThreshold: 50
