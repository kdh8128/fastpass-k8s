apiVersion: v1
kind: Service
metadata:
  name: fastpass-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: fastpass-worker
spec:
  type: ClusterIP
  selector:
    app: fastpass-worker
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: {{ .Values.worker.port }}