{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-servicemonitor
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}

  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - fastpass-api
          - fastpass-worker

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
{{- end }}