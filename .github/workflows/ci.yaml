name: FastPass CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'deploy/helm/fastpass/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'deploy/helm/fastpass/**'
      - '.github/workflows/ci.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kdh8128/fastpass-k8s-api

jobs:
  build:
    name: Build Spring Boot API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kdh8128/fastpass-k8s
            org.opencontainers.image.description=FastPass Spring Boot API
            org.opencontainers.image.licenses=MIT

  update-helm-image-tag:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Update Helm image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("deploy/helm/fastpass/values.yaml")
          image_tag = os.environ["IMAGE_TAG"]

          lines = path.read_text().splitlines()
          output = []
          in_image_block = False

          for line in lines:
              if line.startswith("image:"):
                  in_image_block = True
                  output.append(line)
                  continue

              if in_image_block and line and not line.startswith(" "):
                  in_image_block = False

              if in_image_block and line.strip().startswith("tag:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  output.append(f"{indent}tag: {image_tag}")
              else:
                  output.append(line)

          path.write_text("\n".join(output) + "\n")
          PY

      - name: Commit and push Helm image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/helm/fastpass/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm image tag changes to commit."
            exit 0
          fi

          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push origin HEAD:main